<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;color:#172033;margin:0;background:#fff}.panel{border:1px solid #dbe0e8;border-radius:14px;padding:16px}.room{display:grid;grid-template-columns:210px 1fr;gap:18px}.avatar-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:310px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#edf5fb 0,#dce9f3 58%,#cbdce9 100%);transition:box-shadow .25s}#avatar{width:205px;height:255px;object-fit:contain;object-position:center bottom;transform-origin:50% 90%;filter:drop-shadow(0 8px 10px rgba(0,47,86,.15))}.avatar-card.idle #avatar{animation:idle 3.2s ease-in-out infinite}.avatar-card.thinking #avatar{animation:think 1.1s ease-in-out infinite}.avatar-card.speaking #avatar{animation:speak .24s ease-in-out infinite alternate}.avatar-card.listening{box-shadow:inset 0 0 0 4px rgba(0,75,135,.28)}.avatar-card.listening #avatar{animation:listen 2s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-5px) scale(1.004)}}@keyframes think{50%{transform:translateY(-4px) rotate(.7deg)}}@keyframes listen{50%{transform:translateY(-3px) scale(1.012)}}@keyframes speak{to{transform:translateY(-5px) scale(1.025) rotate(.25deg)}}.role{width:100%;padding:9px 5px;text-align:center;background:rgba(0,47,86,.92);color:#fff;font-weight:700;font-size:13px;box-sizing:border-box}.status{padding:10px 12px;background:#f4f6f9;border-radius:8px;margin-bottom:12px}.status.error{background:#fdecec;color:#a12622}button{padding:10px 18px;border-radius:8px;border:0;cursor:pointer;font-weight:650}#start{background:#ce1141;color:#fff}#stop{background:#e5e9ef;margin-left:8px}#transcript{margin-top:14px;height:225px;overflow:auto;background:#fafbfc;padding:12px;border-radius:8px}.user{color:#004b87}.label{font-weight:bold}@media(max-width:650px){.room{grid-template-columns:1fr}.avatar-card{min-height:240px}#avatar{height:190px}}@media(prefers-reduced-motion:reduce){#avatar{animation:none!important}}
</style></head><body><div class="panel"><div class="room"><div id="avatarCard" class="avatar-card idle"><img id="avatar" alt="AI interviewer"><div id="avatarRole" class="role">Interviewer</div></div><div><div id="status" class="status">Preparing…</div><button id="start" disabled>Start voice interview</button><button id="stop" disabled>End interview</button><div id="transcript"><em>Live transcript will appear here.</em></div></div></div></div><script>
const statusEl=document.querySelector('#status'),transcriptEl=document.querySelector('#transcript'),startBtn=document.querySelector('#start'),stopBtn=document.querySelector('#stop'),avatarCard=document.querySelector('#avatarCard'),avatarImg=document.querySelector('#avatar'),avatarRole=document.querySelector('#avatarRole');let TOKEN='',MODEL='',VOICE='Charon',DURATION=10,initialized=false,ws,stream,ctx,processor,source,silentGain,outputNode,workletUrl,timer,speakingUntil=0,started=false,lastRole='',lastNode=null,transcript=[],pendingAutoEnd=false,autoEndTimer,drainTimer;
function avatarState(name){avatarCard.className='avatar-card '+name}
function post(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}function value(v){post('streamlit:setComponentValue',{value:v,dataType:'json'})}function status(t,error=false){statusEl.textContent=t;statusEl.classList.toggle('error',error)}function fail(t,e){status(t+' '+(e?.message||e||''),true);startBtn.disabled=false;stopBtn.disabled=true}
function add(role,text){if(!text||!text.trim())return;if(role==='You')avatarState('listening');else avatarState('speaking');if(!started){transcriptEl.innerHTML='';started=true}const clean=text.trim();if(role!==lastRole||!lastNode){const p=document.createElement('p');p.className=role==='You'?'user':'ai';const b=document.createElement('span');b.className='label';b.textContent=role+': ';lastNode=document.createTextNode('');p.append(b,lastNode);transcriptEl.append(p);lastRole=role;transcript.push({role:role==='You'?'candidate':'interviewer',text:''})}const old=lastNode.nodeValue||'',sep=old&&!/\s$/.test(old)&&!/^[.,!?;:]/.test(clean)?' ':'';lastNode.nodeValue=old+sep+clean;transcript.at(-1).text=lastNode.nodeValue;transcriptEl.scrollTop=transcriptEl.scrollHeight;if(role==='Interviewer'&&lastNode.nodeValue.toLowerCase().includes('that concludes our interview'))requestAutoEnd()}
function b64(x){let s='';for(let i=0;i<x.length;i+=32768)s+=String.fromCharCode(...x.subarray(i,i+32768));return btoa(s)}function downsample(x,a,b){const r=a/b,n=Math.round(x.length/r),o=new Int16Array(n);for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,x[Math.floor(i*r)]));o[i]=v<0?v*32768:v*32767}return new Uint8Array(o.buffer)}
async function initAudio(){ctx=new AudioContext({sampleRate:24000});const code=`class Q extends AudioWorkletProcessor{constructor(){super();this.q=[];this.o=0;this.n=0;this.p=false;this.wasPlaying=false;this.port.onmessage=e=>{if(e.data==='reset'){this.q=[];this.o=0;this.n=0;this.p=false;this.wasPlaying=false}else{this.q.push(e.data);this.n+=e.data.length}}}process(i,outputs){const out=outputs[0][0];out.fill(0);if(!this.p){if(this.n<2400)return true;this.p=true;this.wasPlaying=true}let x=0;while(x<out.length&&this.q.length){const c=this.q[0],a=c.length-this.o,t=Math.min(out.length-x,a);out.set(c.subarray(this.o,this.o+t),x);x+=t;this.o+=t;this.n-=t;if(this.o>=c.length){this.q.shift();this.o=0}}if(x<out.length){this.p=false;if(this.wasPlaying){this.wasPlaying=false;this.port.postMessage('drained')}}return true}}registerProcessor('pcm-queue',Q)`;workletUrl=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));await ctx.audioWorklet.addModule(workletUrl);outputNode=new AudioWorkletNode(ctx,'pcm-queue');outputNode.port.onmessage=e=>{if(e.data==='drained'){clearTimeout(drainTimer);drainTimer=setTimeout(()=>{if(pendingAutoEnd)finish('interviewer_completed');else avatarState('listening')},900)}};outputNode.connect(ctx.destination)}
function play(data){clearTimeout(drainTimer);const raw=atob(data),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const view=new DataView(bytes.buffer),samples=new Float32Array(Math.floor(raw.length/2));for(let i=0;i<samples.length;i++)samples[i]=view.getInt16(i*2,true)/32768;speakingUntil=performance.now()+350;avatarState('speaking');outputNode.port.postMessage(samples,[samples.buffer])}
async function mic(){stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});await initAudio();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>{if(ws?.readyState!==1||performance.now()<speakingUntil)return;const pcm=downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate,16000);ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(pcm),mimeType:'audio/pcm;rate=16000'}}}))};silentGain=ctx.createGain();silentGain.gain.value=0;source.connect(processor);processor.connect(silentGain);silentGain.connect(ctx.destination)}
function finish(reason='student_ended'){try{clearTimeout(timer);clearTimeout(autoEndTimer);clearTimeout(drainTimer);processor?.disconnect();silentGain?.disconnect();outputNode?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();if(workletUrl)URL.revokeObjectURL(workletUrl);ws?.close()}catch(e){}pendingAutoEnd=false;avatarState('idle');startBtn.disabled=true;stopBtn.disabled=true;status('Interview ended. Preparing feedback…');value({status:'completed',reason,transcript})}
function requestAutoEnd(){if(pendingAutoEnd)return;pendingAutoEnd=true;status('The interviewer has completed the interview. Finishing after the closing message…');autoEndTimer=setTimeout(()=>finish('interviewer_completed'),12000)}
function handleToolCall(call){const responses=[];let shouldEnd=false;for(const fc of(call?.functionCalls||[])){if(fc.name==='end_interview')shouldEnd=true;responses.push({name:fc.name,id:fc.id,response:{result:{status:'ok'}}})}if(responses.length&&ws?.readyState===1)ws.send(JSON.stringify({toolResponse:{functionResponses:responses}}));if(shouldEnd)requestAutoEnd()}
startBtn.onclick=async()=>{try{startBtn.disabled=true;avatarState('thinking');status('Step 1 of 3: opening the secure connection…');if(!isSecureContext)throw Error('Microphone requires localhost or HTTPS.');const url='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token='+encodeURIComponent(TOKEN);ws=new WebSocket(url);ws.onopen=()=>{status('Step 2 of 3: configuring the interviewer…');ws.send(JSON.stringify({setup:{model:'models/'+MODEL,generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:VOICE}}}},inputAudioTranscription:{},outputAudioTranscription:{},sessionResumption:{},contextWindowCompression:{slidingWindow:{}},tools:[{functionDeclarations:[{name:'end_interview',description:'Signal that all planned questions and the spoken closing message have been completed.'}]}]}}))};ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data instanceof Blob?await e.data.text():e.data)}catch(x){fail('Unreadable response.',x);return}if(m.setupComplete){try{status('Step 3 of 3: waiting for microphone permission…');await mic();stopBtn.disabled=false;avatarState('listening');status('Interview in progress — '+DURATION+' minute limit.');timer=setTimeout(()=>finish('time_limit'),DURATION*60000);ws.send(JSON.stringify({clientContent:{turns:[{role:'user',parts:[{text:'Begin the interview now with your opening and first planned question.'}]}],turnComplete:true}}))}catch(x){fail('Microphone unavailable.',x)}}if(m.toolCall)handleToolCall(m.toolCall);const s=m.serverContent;if(s?.inputTranscription?.text)add('You',s.inputTranscription.text);if(s?.outputTranscription?.text)add('Interviewer',s.outputTranscription.text);for(const p of(s?.modelTurn?.parts||[]))if(p.inlineData?.data)play(p.inlineData.data);if(s?.interrupted){outputNode?.port.postMessage('reset');speakingUntil=0;avatarState('listening')}};ws.onerror=()=>status('The live connection failed. Please create a fresh session.',true)}catch(e){fail('The interview could not start.',e)}};stopBtn.onclick=()=>finish();
addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;const a=e.data.args||{};avatarImg.src=a.avatarDataUri||'';avatarRole.textContent=a.avatarRole||'Interviewer';avatarState('idle');if(initialized&&a.token===TOKEN)return;TOKEN=a.token;MODEL=a.model;VOICE=a.voice||'Charon';DURATION=a.durationMinutes||10;initialized=true;startBtn.disabled=false;status('Ready. Select Start voice interview and allow microphone access.');post('streamlit:setFrameHeight',{height:445})});post('streamlit:componentReady',{apiVersion:1});post('streamlit:setFrameHeight',{height:445});setTimeout(()=>{if(!initialized)status('The voice component did not receive its settings. Refresh the page once.',true)},4000);
</script></body></html>
